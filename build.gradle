plugins {
    id 'com.android.application'
}

android {
    namespace 'mu.mc3.presales'
    compileSdk 34

    defaultConfig {
        applicationId "mu.mc3.presales"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
